[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textkit"
version = "0.1.0"
description = "Small, dependency-free text utilities: slugs and simple statistics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
textkit = "textkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/textkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
